# Snapd-Boot-Config-Edition: 4

set default=0
set timeout=3
set timeout_style=hidden

# load only boot selection and kernel command line variables set by snapd from
# the bootenv
load_env --file /EFI/ubuntu/grubenv kernel_status run_system try_run_system snapd_extra_cmdline_args snapd_full_cmdline_args

set snapd_static_cmdline_args='panic=-1'
if [ "$grub_cpu" = "x86_64" ]; then
    set snapd_static_cmdline_args='console=ttyS0,115200n8 console=tty1 panic=-1'
fi
set kernel=kernel.efi
set selected_run_system=
set run_system_status=
set run_system_kernel=

# -------- A/B System Selection ----------
# If try_run_system is specified, save that into selected_run_system and
# clear the try_run_system variable afterwards to avoid rebooting it.
# Otherwise, if run_system is set we store that.

if [ -n "$try_run_system" ]; then
    set selected_run_system="$try_run_system"
    set try_run_system=
    save_env try_run_system
    set run_system_status=trying
elif [ -n "$run_system" ]; then
    set selected_run_system="$run_system"
fi

# If we do actually have an A/B system seed to boot from
# then we attempt to load the A/B system seed's grubenv.
if [ -n "$selected_run_system" ]; then
    search --no-floppy --set=seed_fs --label ubuntu-seed
    set snapd_recovery_kernel=
    set snapd_extra_cmdline_args=
    set snapd_full_cmdline_args=
    load_env --file=($seed_fs)/systems/$selected_run_system/grubenv snapd_recovery_kernel snapd_extra_cmdline_args snapd_full_cmdline_args
    set run_system_kernel="$snapd_recovery_kernel"
fi

set cmdline_args="$snapd_static_cmdline_args $snapd_extra_cmdline_args"
if [ -n "$snapd_full_cmdline_args" ]; then
    set cmdline_args="$snapd_full_cmdline_args"
fi

# -------- Kernel Fallback Selection ----------
# Selection of the kernel to boot based on the kernel_status variable
# In the case of a non A/B system.

if [ -z "$selected_run_system" ]; then
    if [ "$kernel_status" = "try" ]; then
        # a new kernel got installed
        set kernel_status="trying"
        save_env kernel_status
        # run fallback (menu entry #1) if we cannot start the kernel
        set fallback=1

        # use try-kernel.efi
        set kernel=try-kernel.efi
    elif [ "$kernel_status" = "trying" ]; then
        # nothing cleared the "trying snap" so the boot failed
        # we clear the mode and boot normally
        set kernel_status=""
        save_env kernel_status
    elif [ -n "$kernel_status" ]; then
        # ERROR invalid kernel_status state, reset to empty
        echo "invalid kernel_status!!!"
        echo "resetting to empty"
        set kernel_status=""
        save_env kernel_status
    fi
fi

menuentry "Run Ubuntu Core" {
    # If we have a selected run system, then loop mount the kernel
    # snap and chainload it's kernel.efi
    if [ -n "$selected_run_system" ]; then
        loopback loop ($seed_fs)$run_system_kernel
        if [ "$run_system_status" = "trying" ]; then
            if chainloader (loop)/kernel.efi snapd_recovery_mode=run snapd_run_system=$selected_run_system snapd_run_system_status=trying $cmdline_args; then
                boot
            fi
            reboot
        fi
        chainloader (loop)/kernel.efi snapd_recovery_mode=run snapd_run_system=$selected_run_system $cmdline_args
    else
        # use $prefix because the symlink manipulation at runtime for kernel snap
        # upgrades, etc. should only need the /boot/grub/ directory, not the
        # /EFI/ubuntu/ directory
        chainloader $prefix/$kernel snapd_recovery_mode=run $cmdline_args
    fi
}
menuentry "Fallback on failed update" {
    # kernel_status has already been set to "trying", rebooting now
    # will fail the pending kernel update. Note that we cannot simply
    # chainload the fallback kernel as TPM measurements need to be
    # cleaned-up to be able to unseal the key.
    echo "Cannot start new kernel - booting previous one"
    reboot
}
